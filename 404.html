<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Rishi Saha</title>
    <meta name="description" content="The page you are looking for does not exist or has been moved." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-color: #050505;
        --text-color: #ffffff;
        --text-muted: #a0aec0;
        --accent-color: #00ff66;
        --border-color: rgba(255, 255, 255, 0.12);
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        background: radial-gradient(circle at 15% 15%, rgba(0, 255, 102, 0.12) 0%, transparent 45%),
                    radial-gradient(circle at 85% 45%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                    #050505;
        background-attachment: fixed;
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .error-card {
        background: rgba(14, 14, 18, 0.65);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        max-width: 580px;
        width: 100%;
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
        isolation: isolate;
      }

      .error-code {
        font-family: "Space Grotesk", sans-serif;
        font-size: 5.5rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-color);
        margin-bottom: 0.5rem;
        letter-spacing: -0.04em;
        text-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
      }

      .error-title {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }

      .error-desc {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      .search-box {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.75rem;
      }

      .search-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 9999px;
        padding: 0.75rem 1.25rem;
        color: #fff;
        font-size: 0.9rem;
        outline: none;
      }

      .search-input:focus {
        border-color: var(--accent-color);
      }

      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: var(--accent-color);
        color: #050505;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 0.85rem 1.8rem;
        border-radius: 9999px;
        text-decoration: none;
        box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(0, 255, 102, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The requested route or resource does not exist. It may have been moved, renamed, or deleted.</p>
      
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Search projects or sections..." id="error-search" />
      </div>

      <a href="/" class="btn-home">&larr; RETURN TO HOME</a>
    </div>

    <script>
      document.getElementById('error-search')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          window.location.href = '/?search=' + encodeURIComponent(e.target.value);
        }
      });
    </script>
  </body>
</html>
